<title>Gmb Daily Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;color:#1a1a1a;min-height:100vh}
.header{background:white;border-bottom:1px solid #e8eaed;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.gmb-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#4285f4,#34a853);display:flex;align-items:center;justify-content:center;color:white;font-size:17px;flex-shrink:0}
.header h1{font-size:16px;font-weight:700}.header-sub{font-size:11px;color:#5f6368;margin-top:1px}
.header-right{margin-left:auto;font-size:12px;color:#5f6368;text-align:right;line-height:1.5}
.data-banner{background:#e8f0fe;border-bottom:1px solid #c5d8fc;padding:9px 24px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#1a1a1a;position:sticky;top:57px;z-index:19}
.data-banner strong{color:#1967d2;font-weight:700}
.lag-pill{background:#fff;border:1px solid #c5d8fc;border-radius:99px;padding:2px 9px;font-size:11px;color:#5f6368;margin-left:4px}
.group-switcher{background:white;border-bottom:1px solid #e8eaed;padding:8px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:96px;z-index:19}
.group-btn{padding:7px 16px;border-radius:99px;border:1.5px solid #e8eaed;background:white;color:#5f6368;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.group-btn.active{background:#1a73e8;border-color:#1a73e8;color:white;font-weight:600}
.tabs-wrapper{background:white;border-bottom:2px solid #e8eaed;position:sticky;top:140px;z-index:18;display:flex;align-items:stretch}
.tabs-scroll-btn{width:34px;flex-shrink:0;border:none;background:white;cursor:pointer;font-size:20px;color:#5f6368;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;padding-bottom:2px}
.tabs-scroll-btn:hover{color:#1a73e8;background:#f1f3f4}
.tabs-scroll-btn.hidden{opacity:0;pointer-events:none}
.tabs-scroll-btn.left{border-right:1px solid #e8eaed;box-shadow:2px 0 8px rgba(0,0,0,.07)}
.tabs-scroll-btn.right{border-left:1px solid #e8eaed;box-shadow:-2px 0 8px rgba(0,0,0,.07)}
.tabs-bar{flex:1;min-width:0;padding:0 4px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:11px 15px;font-size:13px;font-weight:500;color:#5f6368;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s;flex-shrink:0}
.tab-btn:hover{color:#1a73e8}.tab-btn.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.tab-pane{display:none}.tab-pane.active{display:block}
.nexus-pane{display:none}.nexus-pane.active{display:block}
.content{padding:20px 24px 36px;max-width:1280px}
.section-title{font-size:11.5px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.6px;margin-bottom:11px;margin-top:22px;display:flex;align-items:center;gap:10px}
.section-title .dtag{font-size:11px;font-weight:500;background:#e8f0fe;color:#1a73e8;padding:2px 8px;border-radius:99px;text-transform:none;letter-spacing:0}
.section-title::after{content:"";flex:1;height:1px;background:#e8eaed}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.kpi-card{background:white;border-radius:12px;padding:13px 15px;border:1px solid #e8eaed;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi-label{font-size:11px;color:#5f6368;margin-bottom:6px;font-weight:500}
.kpi-value{font-size:24px;font-weight:700;color:#1a1a1a;line-height:1;letter-spacing:-.5px}
.kpi-trend{margin-top:6px;font-size:11.5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.up{color:#137333;font-weight:600}.down{color:#c5221f;font-weight:600}.flat{color:#80868b}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media(max-width:680px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:white;border-radius:12px;padding:16px 18px;border:1px solid #e8eaed;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chart-title{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:12px}
.chart-wrap{height:200px;position:relative}
.table-card{background:white;border-radius:12px;border:1px solid #e8eaed;margin-top:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.table-hdr{padding:13px 18px;border-bottom:1px solid #e8eaed;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 13px;text-align:left;font-size:11px;font-weight:600;color:#5f6368;background:#f8f9fa;border-bottom:1px solid #e8eaed;white-space:nowrap}
tbody tr{border-bottom:1px solid #f1f3f4}tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8f9fa}tbody td{padding:8px 13px}
.loc-name{font-weight:500}.num{font-variant-numeric:tabular-nums}
.insight-card{background:linear-gradient(135deg,#e8f4fd,#e8f5e9);border-radius:12px;padding:18px 20px;border:1px solid #c5daf6;margin-top:22px}
.insight-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.insight-title{font-size:14px;font-weight:700}
.insight-body{font-size:13px;line-height:1.7;color:#1a1a1a}
.insight-body p{margin-bottom:8px}.insight-body p:last-child{margin-bottom:0}
.loc-header-card{background:white;border-radius:12px;padding:16px 20px;border:1px solid #e8eaed;margin-top:20px;display:flex;align-items:center;gap:14px}
.loc-avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ea4335,#fbbc04);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.loc-name-big{font-size:16px;font-weight:700}.loc-meta{font-size:12px;color:#5f6368;margin-top:2px}
.snap-note{background:#fffde7;border:1px solid #f9ab00;border-radius:8px;padding:8px 14px;font-size:12px;color:#7a4f00;margin-top:14px}
.reviews-card{background:white;border-radius:12px;border:1px solid #e8eaed;margin-top:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}

lease contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. We appreciate your feedback. \n\nThe NexusTours team"},{"date":"2026-10-06","stars":1,"name":"Rafael González","comment":"","reply":"Lamentamos que tu experiencia no haya sido satisfactoria. Por favor, contáctanos por WhatsApp con tu número de reserva para que un agente pueda ayudarte: +1 737 377 4772. El equipo de NexusTours"},{"date":"2026-10-05","stars":1,"name":"Yaoming Guo","comment":"On the morning of September 30, we were waiting in the hotel lobby before 7:00 a.m., as instructed. However, no transportation arrived. When we contacted Nexus Tours, we were told that there was no record in the system showing that our transportation had been rescheduled.\n\nAt that point, we were presented with two choices:\n\nTake a taxi at our own expense so that we could still participate in the tour and enjoy the good weather that day; or\nReschedule the tour again for another day and hope that the weather would be suitable.\n\nBecause we had already planned our vacation around this excursion and the weather was finally good, we chose the first option. We paid out of pocket for a taxi in order to reach the tour.\n\nAfterward, we contacted Nexus Tours and spoke with approximately six different sales/customer service representatives in an effort to resolve the issue and obtain reimbursement for the taxi expense. Unfortunately, our reimbursement request was denied.\n\nWe were told that Sara claims she had informed us that we needed to contact a sales representative to complete the rescheduling, and that the responsibility therefore falls on us. This explanation is extremely frustrating because that is not what was communicated to us by Sara. We relied on the instructions provided by your representative and showed up at the hotel at the agreed-upon time the following morning.\n\nWe should not be held financially responsible for an internal communication failure between Nexus Tours employees or departments. If customers are required to contact a sales representative after being told by a tour representative that the transportation will be arranged for the following day, that requirement should have been clearly communicated to us at the time of rescheduling.\n\nWe acted in good faith, followed the instructions we were given, arrived at the designated pickup location on time, and incurred  in additional transportation costs solely because the promised/expected transportation was not arranged.\n\nTherefore, I am requesting that Nexus Tours reconsider this matter and reimburse the full taxi expense.","reply":"We are truly sorry for the inconvenience you experienced with your transportation and the communication issues described. We understand how frustrating this situation must have been. Please contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can review your case and assist you further. Thank you for sharing your feedback. \n\nThe NexusTours team"},{"date":"2026-10-01","stars":1,"name":"Kim 82","comment":"(Translated by Google) We booked a taxi service through our tour operator. The ride to the hotel with Nexus went fine, but the return journey was unfortunately an absolute disaster. The driver was fifteen minutes late and apparently wanted to make up for lost time. This led to aggressive tailgating, risky overtaking on the right, and unnecessary risks. We did not feel safe. Upon arrival, we had to check in; the driver spoke very broken English, making it impossible for us to really communicate with him, but the man poses a real danger on the road. My husband vomited several times due to stress – both at the airport and on the plane. I cannot give an opinion on the tours, but I advise the company the following: Ensure your staff speaks English and have them take driving lessons again.\n\n(Original)\nTaxirit service geboekt via onze touroperator. De rit naar het hotel met Nexus verliep prima, maar de terugreis was helaas een absolute ramp. De chauffeur was een kwartier te laat en wilde de verloren tijd blijkbaar inhalen. Dit leidde tot agressief bumperkleven, riskant rechts inhalen en onnodige risico's. We voelden ons niet veilig. Bij aankomst moesten we inchecken; de chauffeur sprak zeer gebrekkig Engels, waardoor we niet echt met hem konden communiceren, maar de man vormt een reëel gevaar op de weg. Mijn man moest door de stress meerdere keren overgeven – zowel op de luchthaven als in het vliegtuig. Ik kan over de tours geen mening geven maar raadt het bedrijf het volgende aan: Zorg dat je personeel engels spreekt en laat ze opnieuw rijles nemen.","reply":"We are very sorry to hear about your experience with the return ride and the concerns you had regarding safety and communication. We appreciate your feedback and take it seriously. Please contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. \n\nThe NexusTours team"},{"date":"2026-09-30","stars":1,"name":"Lori Erickson","comment":"Very unreliable AVOID AT ALL COST!!  Transfer from Cancun airport to resort was easy. Return transfer absolutely no one available to get a time of pickup, tried several times online chat, my booking didn’t seem to exist, they had me at a different resort, always passed the buck to another co-worker, had to book a private transfer back to airport! 😡","reply":"We’re very sorry to hear about your experience. This does not reflect the level of service we aim to provide, and we are committed to improving.\n \n Alejandro Vazquez – Senior Director of Customer Success. NexusTours."},{"date":"2026-09-26","stars":1,"name":"Katrina West","comment":"Terrible, I wouldn’t even give them a 1 star.\n\nWe arrived in Cancun & Nexus was included in our West Jet Vacation for transfer to & from hotel.\n\nWe landed, went to Nexus & checked in. 45 minutes go by & everyone who arrived after us were being called for their ride.\n\nWe go and ask a Nexus worker what was going on and was advised we were already checked as on the bus. Obviously, we were not.\nThe worker said he needs 5 mins to find us a bus. After about 15 minutes we were finally on a bus.\n\nNOW for the cherry on top. We called nexus on the Tuesday before departure to confirm time of pick up on the Thursday. We were advised 10am. Ok great!\n\nWe get to the lobby at 9:45/9:50 and we wait\n10:40 approaches and we are wondering what is going on. Again, people are leaving that got to the lobby after us….\n\nMy husband calls Nexus via the concierge's desk and they told him that they can’t find our bus driver. Uhh what? So they said they can’t find our send another but it would be another 30-60 minutes. At this point it is 11am and our flight is for 1:30\n\nThey told us we’d have to call a taxi to get us to the airport and they’d refund us if we provide a receipt.\n\n$55USD and crappy service from Nexus. Now we wait to see if we get a refund.\n\nNEVER again","reply":"We are very sorry to hear about the delays and inconvenience you experienced with our transfer service. We understand how frustrating this must have been. Please contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. Thank you for sharing your feedback. \n\nThe NexusTours Team"},{"date":"2026-09-24","stars":1,"name":"Etronya Harris","comment":"This service sucks had us waiting for a hour to be picked up.they make you wait on everyone to come that's going to the hotel.","reply":"We are sorry to hear about the long wait you experienced. We understand how frustrating that can be. Please contact us on WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. \n\nThe NexusTours team"},{"date":"2026-09-24","stars":1,"name":"James G","comment":"horrible. Hire someone else, anyone else.","reply":"We are sorry to hear about your experience. Please contact us on WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. \n\nThe NexusTours team"},{"date":"2026-09-22","stars":5,"name":"Eduardo Figueiroa (dudufigueiroa)","comment":"","reply":"Muchas gracias por elegir NexusTours. Esperamos poder atenderle nuevamente pronto. El equipo de NexusTours"},{"date":"2026-09-21","stars":5,"name":"Catia Caprara","comment":"Our driver was waiting for us right on time and whisked us away quickly and professionally to our resort. Will use Nexus again for all our excursions and transfers.","reply":"Thank you, Catia, for your kind words! We're glad our driver provided you with a timely and professional service. We look forward to assisting you with all your future excursions and transfers. El equipo de NexusTours"},{"date":"2026-09-19","stars":1,"name":"Jerry Liu","comment":"The nexustour was supposed to pick us up from the resort to the airport but did not show up!! Contacted them and was not given any apologies or reason and just told us to take a taxi. My family had to scramble an uber to get to the airport by ourselves.\n\nAfter the trip I emailed the reciept to them its been 3 weeks and no reply at all.\n\nAVOID THIS AGENCY AT ALL COST IF YOU HAVE A CHOICE.","reply":"We are very sorry to hear about your experience with our transfer service and the lack of response. We understand how stressful this situation must have been for you and your family. Please contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can assist you further. Thank you for your feedback. \n\nThe NexusTours team"},{"date":"2026-09-16","stars":5,"name":"Jessica George","comment":"The employee we meet Narayan was very helpful  and friendly. It was a quick and easy experience","reply":"Thank you for your wonderful feedback. We’re delighted to know you had such a positive experience. We’ll continue working hard to maintain this level of service.\n \n Alejandro Vazquez – Senior Director of Customer Success. NexusTours."},{"date":"2026-09-12","stars":2,"name":"Serena Xu","comment":"Punctual Service, but Serious Issues with Baby Car Seat\n\nThe transportation service was very punctual, and overall Nexustours appeared to be a well-organized company. I also want to specifically recognize Ivan, who was patient, professional, and genuinely helpful when I reported a problem after our arrival. He listened to my concerns and tried to help resolve the situation.\n\nHowever, unfortunately, there were some serious issues that I cannot overlook, especially because we were traveling with our one-year-old baby.\n\nBefore leaving Canada, our travel agent had already requested a baby car seat for our arrival transfer. However, when we arrived in Mexico, there was no car seat in the vehicle, and the driver told us that he was not aware of the request.\n\nOur hotel was the last stop, so our baby had to travel for more than an hour without a car seat while other guests were dropped off at two other hotels first. The driving was also quite uncomfortable. The driver would accelerate between speed bumps and then brake hard before going over them. As an adult, I found the ride uncomfortable, so I was especially concerned about my baby.\n\nWhat was most disappointing was that the same issue happened again on our return transfer. We had booked a private transfer exclusively for our family, and I was specifically told that a baby car seat would be provided. However, there was still no car seat when the vehicle arrived.\n\nFor a family traveling with a young baby, this is not a minor inconvenience. If a car seat has been requested and confirmed, I believe the company should ensure that the transportation provider and driver actually receive and fulfill that request.\n\nWe also booked an Isla Mujeres excursion through Nexustours, with the booking confirmation and payment handled by Nexustours. My understanding is that Cancun Adventures operated the boat as the local tour operator.\n\nMost of the boat crew were friendly and helpful, but I had an uncomfortable experience regarding tipping. We had already given a tip to the tour guide, who was collecting tips on behalf of the crew. Later, another crew member helped us with our stroller while getting off the catamaran. He apparently did not know that we had already tipped and made a comment involving  “tip”in Spanish followed by shaking his head at me when we walked past him.\n\nI completely understand that tipping is customary, but I do not think guests should be made to feel guilty or uncomfortable about tipping, especially when a tip has already been given on behalf of the crew.\n\nI appreciate Ivan’s professionalism and the punctuality of the transportation service. However, the repeated failure to provide a confirmed baby car seat—both on arrival and on departure—is a significant safety concern.\n\nBased on our experience, I would be hesitant to recommend Nexustours to families traveling with babies unless they can guarantee that special requests such as baby car seats are properly communicated and fulfilled.","reply":"We are sorry to hear about the issues you experienced with the baby car seat and tipping during your trip. We appreciate your recognition of Ivan's professionalism and our punctuality. Please contact us via WhatsApp at +1 737 377 4772 with your reservation number so we can better understand and address your concerns. Thank you for sharing your feedback. - The NexusTours team"},{"date":"2026-09-12","stars":1,"name":"Kitty Leung","comment":"Avoid this company. Useless App and in person agent. They just want your money with terrible service. After purchase a private transportion from the hotel to Cancun airport, my flight was delayed by 2 hours. Called them 1 hours 45 minutes before the scheduled picked up time and tried to reschedule, they put you on hold for an hour and then tell you that you cannot change your booking. Waste of money and time. I will not use the service anymore. Why do I spend 3 times of money to get this kind of service where I can get a Uber with 200% flexibility.\n\nP.S. although the owner has responded, there was nothing they can do as it is too late to do anything. But they think things are sorted out. As I learnt from the hotel staff, you do not need a private transportation, just use Uber and it would have saved all the trouble.","reply":"We are sorry to hear about your experience with our private transportation service and the difficulties you faced trying to reschedule. We understand your frustration and appreciate your feedback. Please contact us via WhatsApp at +1 737 377 4772 with your booking number so we can assist you further. Thank you for sharing your concerns. \n\nThe NexusTours team"},{"date":"2026-09-11","stars":5,"name":"Veronica Ortiz","comment":"Hoy solicité servicio de traslado hotel Cancún  - Aeropuerto me atendió el Sr Octavio Alejandro Mendoza García , tuve una excelente atención por parte del Sr Octavio , y con respecto al traslado buena experiencia con unidad nueva y muy buena atención del chofer  , lo recomiendo ampliamente 👌\n\n(Translated by Google)\nToday I requested a transfer service from my Cancun hotel to the airport. Mr. Octavio Alejandro Mendoza García assisted me, and I received excellent service from him. The transfer itself was a great experience with a new vehicle and very attentive driver. I highly recommend him! 👌","reply":"Muchas gracias, Verónica, por compartir tu experiencia positiva con el Sr. Octavio Alejandro Mendoza García y nuestro servicio de traslado en Cancún. Nos alegra saber que la atención y la unidad fueron de tu agrado. ¡Esperamos verte pronto de nuevo! \n\nEl equipo de NexusTours"}],"dest":"Cancún"},{"id":"5302718698828002560","name":"NexusTours - Planet Hollywood Cancun","store":"08069803460425424432","status":"Open","city":"Cancún","country":"MX","k":{"yd":{"views":3,"maps":2,"search":1,"actions":0,"website":0,"phone":0,"directions":0},"pd":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"directions":0},"w7":{"views":24,"maps":8,"search":16,"actions"  Maria! 🙌✨ A hidden gem? We'll take it, but we're hoping it won't stay hidden for long 😄 So glad you had a great time with your friends and that Javi made the session so engaging. We'll make sure he hears this. Whether you're brand new or already hooked, there's always a spot for you at The District. Can't wait to see you back on the courts!"},{"date":"2026-10-05","stars":5,"name":"A M","comment":"Such a great place to play!\nI had a really good experience at The District Padel Club. The whole place has a great vibe, the courts and facilities are excellent, and everything feels new and very well maintained.\nEveryone was friendly and welcoming, and the atmosphere is relaxed but still feels professional. I also really liked the fact that there are spaces to hang out before or after playing.\n\nDefinitely a place I’ll be coming back to. Highly recommended!","reply":"Thank you so much, A M! 🙌✨ A great vibe, new and well-kept facilities, and a team that makes you feel welcome: that's the balance we aim for at The District. We're so glad you enjoyed the spaces to hang out before and after your game too. Can't wait to have you back on the courts soon! 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"Aina Salom","comment":"¡Nos ha encantado! El sitio está genial, las instalaciones están muy cuidadas y el ambiente es fantástico. Todo está muy bien organizado y el personal es súper amable y atento.\nEs un sitio perfecto tanto si ya juegas habitualmente como si estás empezando. Sin duda, repetiremos. ¡Muy recomendable!\n\n(Translated by Google)\nWe loved it! The place is great, the facilities are very well maintained, and the atmosphere is fantastic. Everything is very well organized, and the staff is super friendly and attentive.\n\nIt's a perfect place whether you're a regular player or just starting out. We'll definitely be back. Highly recommended!","reply":"Gracias, Aina! 🙌✨ Qué alegría leer esto. Un sitio donde todo fluye, el equipo te hace sentir bienvenida y da igual si juegas desde hace años o apenas estás empezando: así es The District. Y gracias por las fotos, ¡el neón luce increíble! 😍 Tu pista te espera cuando quieras volver. 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"Alba","comment":"","reply":"Alba, thank you for the 5 stars! 🙌 It means a lot to have you as part of The District. Hope to see you back on the courts soon, we'll keep the good vibes coming. 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"Bárbara Rodrigo","comment":"I’m absolutely impressed by The District Padel Club. The facilities are incredible, with every detail carefully thought out to create a fantastic experience. The club is very spacious, modern, and exceptionally clean.\nI also love the different areas available — from the coffee area to the relaxing spaces, and even dedicated areas for kids. It really feels like a place designed for everyone, whether you’re there to play, train, relax, or simply spend some time with friends.\n\nThe coaches are also excellent. They’re very professional, knowledgeable, and do a great job during the lessons, making them both enjoyable and effective.\n\nOverall, an amazing padel club with top-quality facilities and a great atmosphere. Highly recommended!","reply":"Thank you so much, Bárbara! 🙌✨ We're thrilled the details came through: from the coffee area to the relaxing spaces and the kids' areas, we built The District to be a place for everyone, whether you're here to play, train, relax or just hang out with friends. We'll pass your kind words along to our coaches, they'll be so happy to hear it. Can't wait to see you back on the courts soon! 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"Carmen Dengra","comment":"Such a great place for socializing, playing padel and good vibes. This club has all you need to enjoy with friends the racquet sports, share a drink afterwards and shower/get ready there for whatever you're up to next in your day! Kind stuff, tasty nibbles, clean premises. 5 out of 5","reply":"Thank you so much, Carmen! 🙌✨ Padel, good vibes, a drink with friends and a fresh shower after: that's exactly the kind of day we want The District to be. So glad the team, the tasty bites and the clean space all added to it. Bring the crew back anytime! 🎾🥤"},{"date":"2026-10-05","stars":5,"name":"Juana Pita","comment":"⭐⭐⭐⭐⭐\n\nWe went to District Pádel yesterday and absolutely loved the experience! The courts are fantastic and very well maintained. The ceilings are also really high, which makes a big difference because there’s much less noise and it’s much more comfortable to play.\n\nThe staff are wonderful too — very friendly, welcoming, and helpful. They also have a café, so you can come for a game, have breakfast, or enjoy a beer or a glass of wine afterwards.\n\nIt’s a great place to enjoy playing padel, relax, and spend some time with friends. Great facilities, great atmosphere, and great people. We’ll definitely be back! 🎾😊","reply":"Thank you so much, Juana! 🙌✨ We love that you noticed the little things, like the high ceilings and the quieter, more comfortable play. And a game followed by breakfast, a beer or a glass of wine with friends? That's exactly how we picture a day at The District. We're so glad the team made you feel welcome. Can't wait to see you back on the courts! 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"Natalia Aguado","comment":"Love The District in Mississauga! ❤️ Such a fun vibe, the courts are top-notch and everyone is so friendly and welcoming. Always have the best time playing here and can’t wait to come back! Definitely recommend!","reply":"Thank you so much, Natalia! 🙌💚 A fun vibe, top-notch courts and a friendly welcome every time: that's exactly what we want you to feel when you walk into The District. We love that you always have the best time here, and we can't wait to have you back on the courts soon! 🎾🏓"},{"date":"2026-10-05","stars":5,"name":"beatriz carrasco","comment":"","reply":"Thank you for the 5 stars, Beatriz! 🙌✨ We're so glad you enjoyed The District. Your court is waiting whenever you want to come back. 🎾🏓"},{"date":"2026-10-04","stars":5,"name":"Ana Vírseda","comment":"Awesome experience at The District! Javier is a great instructor and Celia and Maria at the desk were really helpful and nice.","reply":"Thank you so much, Ana! 🙌✨ We're thrilled you had an awesome experience at The District. Javier, Celia and Maria will be so happy to hear this, a great lesson and a warm welcome at the desk is exactly what we hope every visit feels like. Hope to see you back on the courts soon! 🎾"},{"date":"2026-10-04","stars":5,"name":"Noemí Moltó","comment":"Ambiente distendido, profesionales de gran nivel e instalaciones de primera. Una gran experiencia\n\n(Translated by Google)\nRelaxed atmosphere, top-notch professionals, and first-rate facilities. A great experience.","reply":"¡Gracias, Noemí! 🙌✨ Nos encanta que hayas sentido el ambiente, el equipo y las instalaciones tal como los imaginamos: para que disfrutes cada partido sin complicarte. Tu cancha te espera cuando quieras volver. 🎾🏓"},{"date":"2026-10-04","stars":5,"name":"Silvia","comment":"Una experiencia única, muy buenas pistas para jugar al pádel.\nUna atención excepcional por parte de Celia y María\n\n(Translated by Google)\nA unique experience, excellent courts for playing padel.\nExceptional service from Celia and María.","reply":"¡Gracias, Silvia! 🙌✨ Qué bueno que viviste el padel como lo soñamos: buenas pistas y un equipo que te hace sentir en casa. Le haremos llegar tus palabras a Celia y María, seguro les alegran el día. Aquí te esperamos para tu próximo partido. 🎾"},{"date":"2026-10-02","stars":4,"name":"Nhan Vo","comment":"","reply":"Thank you for the 4 stars, Nhan! 🙌 We're glad you enjoyed your visit to The District, and we'd love to hear how we can make your next one even better. Hope to see you back on the courts soon! 🎾🏓"},{"date":"2026-09-26","stars":5,"name":"Adonis Fanith","comment":"I was visiting Toronto and heard about this place so I had to try it out. The courts are so nice. We paid extra for the main court with the ring lights and it was definitely worth it. Definitely gonna stop by whenever I'm in Toronto! Shout out to Madison and Jonathan at the front desk were great. They gave us a great tour and made delicious smoothies. 5 Star customer service.","reply":"Thank you, Adonis! 🙌✨ So glad you decided to check us out on your visit to Toronto — and that the main court with the ring lights was worth every extra penny! Madison and Jonathan will love hearing this, from the tour to those smoothies, sounds like they went all out. Next time you're in town, The District will be ready for you! 🎾🏓"},{"date":"2026-09-22","stars":5,"name":"Lidia Sohail","comment":"Highly recommend, their staff is always so kind and professional every time. Owen was extremely helpful! Definitely my go to pickle ball spot.","reply":"Thank you, Lidia! 🙌✨ So glad our team's kindness and professionalism keeps you coming back — Owen will be happy to hear he made your visit even better. Being your go-to pickleball spot means a lot to us. See you back on the courts soon! 🎾🏓"},{"date":"2026-09-17","stars":5,"name":"sam","comment":"Maddison is the best. Very helpful and great customer service.","reply":"Thank you, Sam! 🙌✨ Maddison always brings that helpful, top-notch service, and it's great to hear it made your visit even better. We'll pass along the love — see you back on the courts soon! 🎾🏓"},{"date":"2026-09-15","stars":2,"name":"Kris Padilla","comment":"Great facility!\n\nHave been here 5 times now and the first 4 visits were perfect - on our 5th visit we unfortunately had an issue where the lights were shut off on our court at 10:50 when we had booked the court from 9:30-11pm. We were told by staff on-site to escalate to a manager, so we sent an email on Aug 9th. We received a response from Pablo on Aug 11th saying that the lights being shut off prior to the end of our booking contract is unacceptable and that he would investigate and get back to us.\n\nWe sent a follow up email on Aug 20th and again on Aug 28th and have not heard back as of Sep 15th.\n\nThe facility is very good, but this disregard of a legitimate customer service concern leaves a bitter taste.","reply":"Thank you for taking the time to share your experience and for your continued support of The District. We’re glad to hear that your first four visits were great and that you’ve enjoyed the facility overall.\n\nWe sincerely apologize for what happened during your fifth visit and we completely understand your frustration. More importantly, we apologize that after you brought the matter to our attention, we did not follow up with you as promised. \n\nWe hope to have the chance to welcome you back and provide the experience you’ve come to expect from The District.\n\nOur team will contact you shortly.  "},{"date":"2026-09-09","stars":5,"name":"Ahmed A","comment":"I had the best possible experience at the district, came in to everyone smiling, the ambience is amazing and specific shoutout to Hamza for providing the smoothest experience. I’m now officially a member!","reply":"Thank you, Ahmed! 🙌✨ Everyone smiling and a great ambience the moment you walked in — that's exactly the welcome we want every guest to feel at The District. Hamza will be thrilled to hear this, he really does bring it every time. And congrats on officially joining the club — welcome to the family! 🎾🏓"}],"dest":"Otros"},{"id":"16645081977196445193","name":"Villa de Mangos","store":"","status":"Open","city":"Emiliano Zapata","country":"MX","k":{"yd":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"directions":0},"pd":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"directions":0},"w7":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"directions":0},"p7":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"directions":0},"m30":{"views":0,"maps":0,"search":0,"actions":0,"website":0,"phone":0,"dir was presented to us at the time of purchase, and the conditions and services provided were unacceptable.\n\nTwo of us separately paid to participate in what was presented as a fun park excursion that included dune buggy riding, zip lining, and horseback riding. Based on the information provided to us, we expected an enjoyable excursion centered around these activities.\n\nInstead, several important aspects of the excursion were not disclosed to us beforehand.\n\nFirst, we were taken to a cave where swimming was required or expected, despite never being informed that swimming would be part of the excursion. We were completely unprepared and did not have bathing suits with us. We were therefore forced to spend additional money purchasing bathing suits simply to participate.\n\nThere were also issues with the transportation and basic provisions. During the bus ride, the supply of bottled water ran out. We were also charged $3 for bottles of water at the excursion site by a woman selling them, when we were under the impression that water was being provided through the excursion. This should have been clearly communicated to us beforehand.\n\nThe dune buggy experience was also not what we expected or were led to believe we were purchasing. We were two paying participants, yet we were required to share one dune buggy rather than each having our own. The route itself was extremely poor, consisting of broken-up and heavily potholed roads, with children playing in areas where the vehicles were traveling. This did not feel like the safe, enjoyable recreational experience that was represented to us.\n\nThe horseback riding was particularly disappointing. Rather than being an enjoyable ride in a scenic or recreational setting, we were taken through an area that appeared to be more like a landfill or dumping area. This was extremely unpleasant and completely inconsistent with what we expected when purchasing a fun excursion.\n\nOverall, we feel that the excursion was not honestly or adequately represented to us at the time of purchase. Had we been told about the cave swimming, the additional expenses, the shared dune buggy, the conditions of the roads and riding areas, and the actual nature of the horseback riding experience, we would not have purchased this excursion.\n\nAdditionally, after speaking with other hotel guests and reviewing their experiences, we understand that the excursion involves a substantial amount of travel, including a long drive and boat transportation, for only approximately two hours of actual beach/park enjoyment. We came on vacation expecting to enjoy the beach and the experience that was sold to us—not spend more time traveling to and from an excursion than actually enjoying the activities.\n\nThis is more than simply being dissatisfied with an excursion. The service we received did not match what was represented and sold to us.\n\nTherefore, I am formally requesting:\n\n1. A full refund for yesterday’s excursion for both paying participants.\n2. Cancellation and a full refund for the excursion scheduled for tomorrow for both participants.\n3. Confirmation that these cancellations will not result in any additional charges or penalties.\n\nWe purchased these excursions based on the information provided by the hotel, and we feel that we did not receive the experience or level of service that was represented to us.\n\nI would appreciate having this matter reviewed by hotel management and resolved promptly. We are requesting a complete refund for both excursions because the excursions did not provide the experience or services that were presented to us when we paid for them.\n\nThank you for your prompt attention to this matter. I look forward to receiving confirmation of the cancellation and full refund.","reply":""}],"dest":"Punta Cana"},{"id":"8307774719617170166","name":"Royalton Excursions by NexusTours - Royalton Hideaway Blue Waters","store":"17670615838250642475","status":"Open","city":"Falmouth","country":"   sect("📅 Día más reciente",fd(D.lastDate))+kpis(l.k.yd,l.k.pd)+sect("📊 Últimos 7 días",W7)+kpis(l.k.w7,l.k.p7)+charts(pfx+i)+insight("Insights — "+l.name,(D.groups[g].insights||{})[l.id])+reviewsCard(l.reviews)+'</div>'}
function mktOverview(){
  const g=D.groups.mkt,t=g.total;
  const rows=g.locs.slice().sort((a,b)=>(b.k.yd.views||0)-(a.k.yd.views||0)).map(l=>'<tr><td class="loc-name">'+esc(l.name)+'</td>'+MK.map(k=>'<td class="num">'+fmt(l.k.yd[k])+'</td>').join("")+'</tr>').join("");
  return'<div class="content">'+sect("📅 Día más reciente",fd(D.lastDate))+kpis(t.k.yd,t.k.pd)+sect("📊 Últimos 7 días",W7+" vs semana anterior")+kpis(t.k.w7,t.k.p7)+charts("mkt-total")+
  '<div class="table-card"><div class="table-hdr">📍 Desglose por ubicación — '+fd(D.lastDate)+'</div><table><thead><tr><th>Ubicación</th>'+MK.map(k=>'<th>'+MS[k]+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+insight("Insights generales",(g.insights||{}).__resumen__)+'</div>'}
function dl(c,p){const d=c-p;if(!d)return'<div class="dl"><span class="z">—</span></div>';const cls=d>0?"u":"d";const pc=p?" "+Math.round(d/p*100)+"%":"";return'<div class="dl"><span class="'+cls+'">'+(d>0?"▲+":"▼")+d+pc+'</span></div>'}
function ndmPanel(per,prev,label){
  const g=D.groups.nexus;const by={};g.locs.forEach(l=>{(by[l.dest]=by[l.dest]||[]).push(l)});
  const cols=[...MK.map(k=>[k,"k"]),[null,"rv"]];
  const cell=(c,p)=>'<td>'+fmt(c)+dl(c,p)+'</td>';
  const dests=Object.keys(by).sort((a,b)=>by[b].reduce((s,l)=>s+(l.k[per].views||0),0)-by[a].reduce((s,l)=>s+(l.k[per].views||0),0));
  let html='<div class="ndm-period-lbl">Período: '+label+'</div><div class="ndm-wrap"><table class="ndm-t"><thead><tr><th>🌎 Destino</th>'+MK.map(k=>'<th>'+MS[k]+'</th>').join("")+'<th>⭐ Reseñas</th></tr></thead>';
  const val=(l,k,p)=>k===null?(l.rv[p]||0):(l.k[p][k]||0);
  dests.forEach((d,di)=>{const ls=by[d].slice().sort((a,b)=>(b.k[per].views||0)-(a.k[per].views||0));const id="ndm_"+per+"_"+di;
    html+='<tbody><tr class="ndm-dest-row" data-target="'+id+'"><td><i class="ndm-chevron">▶</i><b>'+esc(d)+'</b><span class="ndm-badge">'+ls.length+'</span></td>'+cols.map(([k])=>cell(ls.reduce((a,l)=>a+val(l,k,per),0),ls.reduce((a,l)=>a+val(l,k,prev),0))).join("")+'</tr></tbody>';
    html+='<tbody class="ndm-loc-group" id="'+id+'">'+ls.map(l=>'<tr class="ndm-loc-row"><td>↳ '+esc(l.name)+'</td>'+cols.map(([k])=>cell(val(l,k,per),val(l,k,prev))).join("")+'</tr>').join("")+'</tbody>'});
  const all=g.locs;html+='<tfoot><tr><td><b>Total</b></td>'+cols.map(([k])=>cell(all.reduce((a,l)=>a+val(l,k,per),0),all.reduce((a,l)=>a+val(l,k,prev),0))).join("")+'</tr></tfoot></table></div>';
  return html}
const GLOSS=[["👁","Vistas totales","Número de veces que el perfil fue visto en Maps o Search. Incluye vistas directas e indirectas."],["🗺","Vistas Maps","Vistas generadas desde Google Maps — usuarios que encontraron el perfil al explorar el mapa."],["🔍","Vistas Search","Vistas desde Google Search — usuarios que encontraron el perfil al hacer una búsqueda de texto."],["🎯","Acciones totales","Total de interacciones: visitar el sitio web, llamar o pedir indicaciones. Indica intención real."],["🌐","Visitas web","Clicks al enlace del sitio web desde el perfil. Tráfico directo hacia la página."],["📞","Llamadas","Clics en el botón de llamada. En móvil inicia la llamada directamente; alta intención de compra."],["🧭","Rutas","Solicitudes de cómo llegar desde Google Maps. Señal de visita física planeada."],["⭐","Reseñas","Número de reseñas nuevas recibidas en el período. Refleja satisfacción y engagement."]];
function nexusOverview(){
  const g=D.groups.nexus,t=g.total;
  return'<div class="content">'+sect("📅 Día más reciente",fd(D.lastDate))+kpis(t.k.yd,t.k.pd)+
  '<div class="table-card"><div class="table-hdr">🌎 Por destino</div><div style="padding:12px 10px 10px"><div class="ndm-toggle"><button class="ndm-toggle-btn active" data-p="yd">📅 Último día</button><button class="ndm-toggle-btn" data-p="w7">📆 Últimos 7 días</button><button class="ndm-toggle-btn" data-p="m30">📊 Últimos 30 días</button></div>'+
  '<div id="ndm-panel-yd" class="ndm-panel active">'+ndmPanel("yd","pd",fd(D.lastDate)+" vs día anterior")+'</div><div id="ndm-panel-w7" class="ndm-panel">'+ndmPanel("w7","p7",W7+" vs 7 días anteriores")+'</div><div id="ndm-panel-m30" class="ndm-panel">'+ndmPanel("m30","p30",fd(L30[0])+" – "+fd(D.lastDate)+" vs 30 días anteriores")+'</div></div></div>'+
  '<div class="gloss"><div class="gloss-h">📖 Glosario de métricas</div><div class="gloss-b">'+GLOSS.map(([i,n,d])=>'<div class="gloss-i"><span style="font-size:18px;flex-shrink:0">'+i+'</span><div><b>'+n+'</b><br><span class="t">'+d+'</span></div></div>').join("")+'</div></div>'+
  insight("Insights generales — NexusTours",(g.insights||{}).__resumen__)+'</div>'}
// ── Build DOM ──
function build(){
  document.getElementById("gen").textContent=D.gen;
  document.getElementById("last").textContent=fd(D.lastDate);
  document.getElementById("grp-nexus").textContent="🗺 "+D.groups.nexus.label+" ("+D.groups.nexus.locs.length+")";
  document.getElementById("grp-mkt").textContent="🏢 "+D.groups.mkt.label;
  document.getElementById("hdr-sub").textContent=D.groups.mkt.label+" · Todas las ubicaciones";
  const mb=document.getElementById("mkt-tabs-bar"),mc=document.getElementById("mkt-tab-content");
  mb.innerHTML='<button class="tab-btn active" data-tab="resumen">📊 Resumen</button>'+D.groups.mkt.locs.map((l,i)=>'<button class="tab-btn" data-tab="loc-'+i+'">📍 '+esc(l.name)+'</button>').join("");
  mc.innerHTML='<div id="tab-resumen" class="tab-pane active">'+mktOverview()+'</div>'+D.groups.mkt.locs.map((l,i)=>'<div id="tab-loc-'+i+'" class="tab-pane">'+locPane("mkt",l,i,"x")+'</div>').join("");
  const nb=document.getElementById("nexus-tabs-bar"),nc=document.getElementById("nexus-tab-content");
  nb.innerHTML='<button class="tab-btn active" data-tab="nexus-overview">🗺 Resumen</button>'+D.groups.nexus.locs.map((l,i)=>'<button class="tab-btn" data-tab="nexus-loc-'+i+'">📍 '+esc(l.name)+'</button>').join("");
  nc.innerHTML='<div id="nexus-tab-overview" class="nexus-pane active">'+nexusOverview()+'</div>'+D.groups.nexus.locs.map((l,i)=>'<div id="nexus-tab-loc-'+i+'" class="nexus-pane">'+locPane("nexus",l,i,"nx")+'</div>').join("");
}
build();
// ── Charts ──
const opts={responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:10,padding:9}}},scales:{x:{ticks:{font:{size:10},maxTicksLimit:8},grid:{display:false}},y:{ticks:{font:{size:10}},beginAtZero:true,grid:{color:"#f1f3f4"}}}};
const ln=(data,color,label,fill)=>({label,data,borderColor:color,backgroundColor:fill||"transparent",tension:.35,borderWidth:2,pointRadius:2,pointHoverRadius:4,fill:!!fill});
const chartReg={};
function mkChart(id,datasets){if(typeof Chart==="undefined")return;if(chartReg[id])chartReg[id].destroy();const c=document.getElementById(id);if(!c)return;chartReg[id]=new Chart(c,{type:"line",data:{labels:lbls,datasets},options:opts})}
function drawPair(pfx,s){
  mkChart(pfx+"v",[ln(s.views,"#1a73e8","Total","rgba(26,115,232,0.07)"),ln(s.maps,"#34a853","Maps",null),ln(s.search,"#fbbc04","Search",null)]);
  mkChart(pfx+"a",[ln(s.actions,"#ea4335","Total","rgba(234,67,53,0.07)"),ln(s.website,"#1a73e8","Web",null),ln(s.phone,"#34a853","Llamadas",null),ln(s.directions,"#9334e6","Rutas",null)]);
}
// ── Reviews filter (relative to report generation date) ──
function applyReviewFilter(card){
  const fS=card._fStars??0,fD=card._fDays??7;
  const cutoff=addDays(D.genDate,-(fD-1));let shown=0;
  card.querySelectorAll(".review-item").forEach(it=>{const ok=(fS===0||+it.dataset.stars===fS)&&it.dataset.date>=cutoff;it.hidden=!ok;if(ok)shown++});
  const e=card.querySelector(".no-reviews");if(e)e.hidden=shown!==0;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".sf-btn,.df-btn");
  if(b){const card=b.closest(".reviews-card");card.querySelectorAll('[data-group="'+b.dataset.group+'"]').forEach(x=>x.classList.remove("active"));b.classList.add("active");
    if(b.dataset.group==="star")card._fStars=+b.dataset.v;else card._fDays=+b.dataset.v;applyReviewFilter(card);return}
  const t=e.target.closest(".ndm-toggle-btn");
  if(t){document.querySelectorAll(".ndm-toggle-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".ndm-panel").forEach(p=>p.classList.remove("active"));t.classList.add("active");document.getElementById("ndm-panel-"+t.dataset.p).classList.add("active");return}
  const r=e.target.closest(".ndm-dest-row");
  if(r){const g=document.getElementById(r.dataset.target);const open=g.classList.toggle("open");r.classList.toggle("open",open);return}
  const tb=e.target.closest(".tab-btn");if(tb)activateTab(tb.dataset.tab);
});
document.querySelectorAll(".reviews-card").forEach(c=>{c._fStars=0;c._fDays=7;applyReviewFilter(c)});
// ── Group / tab switching ──
let _activeGroup="mkt";
function activateGroup(group){
  _activeGroup=group;
  document.getElementById("grp-mkt").classList.toggle("active",group==="mkt");
  document.getElementById("grp-nexus").classList.toggle("active",group==="nexus");
  document.getElementById("mkt-tabs-wrapper").hidden=group!=="mkt";
  document.getElementById("nexus-tabs-wrapper").hidden=group!=="nexus";
  document.getElementById("mkt-tab-content").hidden=group!=="mkt";
  document.getElementById("nexus-tab-content").hidden=group!=="nexus";
  setTimeout(()=>updateArrows(group),100);setTimeout(()=>updateArrows(group),700);
}
const inited=new Set();
function activateTab(tabId){
  const isNexus=tabId.startsWith("nexus-");const barId=isNexus?"nexus-tabs-bar":"mkt-tabs-bar";
  document.querySelectorAll("#"+barId+" .tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tabId));
  if(isNexus){
    const paneId=tabId==="nexus-overview"?"nexus-tab-overview":"nexus-tab-"+tabId.replace("nexus-","");
    document.querySelectorAll(".nexus-pane").forEach(p=>p.classList.toggle("active",p.id===paneId));
    if(tabId!=="nexus-overview"&&!inited.has(tabId)){inited.add(tabId);const i=+tabId.replace("nexus-loc-","");drawPair("nx"+i,D.groups.nexus.locs[i].series)}
  }else{
    document.querySelectorAll(".tab-pane").forEach(p=>p.classList.toggle("active",p.id==="tab-"+tabId));
    if(!inited.has(tabId)){inited.add(tabId);
      if(tabId==="resumen")drawPair("mkt-total",D.groups.mkt.total.series);
      else{const i=+tabId.replace("loc-","");drawPair("x"+i,D.groups.mkt.locs[i].series)}}
  }
  const ab=document.getElementById(barId).querySelector('[data-tab="'+tabId+'"]');
  if(ab)ab.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  setTimeout(()=>updateArrows(_activeGroup),300);
}
function tabsScroll(group,dir){const bar=document.getElementById(group+"-tabs-bar");if(bar)bar.scrollBy({left:dir*220,behavior:"smooth"})}
function updateArrows(group){const bar=document.getElementById(group+"-tabs-bar"),prev=document.getElementById(group+"-tabs-prev"),next=document.getElementById(group+"-tabs-next");if(!bar||!prev||!next)return;prev.classList.toggle("hidden",bar.scrollLeft<=2);next.classList.toggle("hidden",bar.scrollLeft+bar.clientWidth>=bar.scrollWidth-2)}
["mkt","nexus"].forEach(g=>{const bar=document.getElementById(g+"-tabs-bar");if(bar){bar.addEventListener("scroll",()=>updateArrows(g));new ResizeObserver(()=>updateArrows(g)).observe(bar)}
  document.getElementById(g+"-tabs-prev").addEventListener("click",()=>tabsScroll(g,-1));document.getElementById(g+"-tabs-next").addEventListener("click",()=>tabsScroll(g,1))});
document.getElementById("grp-mkt").addEventListener("click",()=>activateGroup("mkt"));
document.getElementById("grp-nexus").addEventListener("click",()=>activateGroup("nexus"));
activateTab("resumen");
window.addEventListener("load",()=>{if(!chartReg["mkt-totalv"]){inited.delete("resumen");activateTab("resumen")}updateArrows("mkt");updateArrows("nexus")});

// ── Copiar HTML ──
(function(){
  const btn=document.getElementById("copy-html"),panel=document.getElementById("copy-panel"),ta=document.getElementById("copy-ta"),msg=document.getElementById("copy-msg");
  if(!btn)return;
  const kb=Math.round(SNAP.length/1024);
  btn.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(SNAP);btn.textContent="✓ HTML copiado ("+kb+" KB)";setTimeout(()=>btn.textContent="📋 Copiar HTML",2500);return}catch(e){}
    ta.value=SNAP;panel.hidden=false;ta.focus();ta.select();msg.textContent="Tu navegador no permitió copiar automáticamente. El HTML ("+kb+" KB) ya está seleccionado: presiona Ctrl+C (o ⌘+C) para copiarlo.";
  });
  document.getElementById("copy-close").addEventListener("click",()=>{panel.hidden=true;ta.value=""});
})();
</script></body></html>
